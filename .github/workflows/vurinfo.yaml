name: VURINFO index

# Genera el .VURINFO raíz (array JSON, esquema v1) que consume vary y lo
# commitea en master. Solo se dispara con cambios en plantillas; el commit
# resultante solo toca el .VURINFO de la raíz, así que no se re-dispara
# (sin bucle).
#
# A propósito SIN contenedor ni masterdir: z-packages son solo plantillas
# (se compila en z-repo/Vary). El generador es parseo estático con la misma
# semántica que el fallback de vary; vale porque las plantillas de este repo
# son asignaciones estáticas (sin sustituciones en version).

on:
  push:
    branches: [master]
    paths: ['srcpkgs/**']
  workflow_dispatch:

permissions:
  contents: write

# Varios merges seguidos disparan varias ejecuciones a la vez; sin esto
# todas compiten por el mismo push y solo una gana.
concurrency:
  group: vurinfo
  cancel-in-progress: false

jobs:
  vurinfo:
    name: Generate root .VURINFO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Regenerar sobre el master mas reciente y reintentar ante carreras
          # entre ejecuciones/merges concurrentes.
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git checkout -B master origin/master
            python3 .github/scripts/gen-vurinfo.py .VURINFO srcpkgs
            git add .VURINFO
            if git diff --cached --quiet; then
              echo "sin cambios en .VURINFO"
              exit 0
            fi
            git commit -m "vur: regenerate root .VURINFO"
            if git push origin HEAD:master; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done
          echo "failed to push .VURINFO after retries"
          exit 1
