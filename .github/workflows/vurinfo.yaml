name: VURINFO index

# Genera el .VURINFO raíz (array JSON, esquema v1) que consume vary y lo
# commitea en master. Solo se dispara con cambios en plantillas; el commit
# resultante solo toca el .VURINFO de la raíz, así que no se re-dispara
# (sin bucle).
#
# Método: checkout completo de void-packages + overlay de nuestros srcpkgs
# (como documenta vary en docs/VURINFO.md). Todo corre como root en
# contenedor privilegiado, igual que el builder de VUP: así xbps-src usa
# chroot real y no necesita user namespaces.

on:
  push:
    branches: [master]
    paths: ['srcpkgs/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Ref de Vary del que se descarga scripts/vurinfo.jq (fuente del esquema).
  VARY_REF: vary-mvp

jobs:
  vurinfo:
    name: Generate root .VURINFO
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
      volumes:
        - /dev:/dev
    steps:
      - name: Checkout z-packages
        uses: actions/checkout@v4
        with:
          path: zpkgs

      - name: Checkout void-packages
        uses: actions/checkout@v4
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y git curl jq bash

      - name: Overlay templates and bootstrap
        run: |
          cp -r zpkgs/srcpkgs/* void-packages/srcpkgs/
          cd void-packages
          ./xbps-src binary-bootstrap

      - name: Generate root .VURINFO
        run: |
          cd void-packages
          PKGS="$(for d in ../zpkgs/srcpkgs/*/; do basename "$d"; done | tr '\n' ' ')"
          # shellcheck disable=SC2086
          env VARY_REF="$VARY_REF" OUT_FILE="$GITHUB_WORKSPACE/zpkgs/.VURINFO" \
            bash "$GITHUB_WORKSPACE/zpkgs/.github/scripts/gen-vurinfo-root.sh" $PKGS

      - name: Commit and push if changed
        working-directory: zpkgs
        run: |
          git add .VURINFO
          if git diff --cached --quiet; then
            echo "sin cambios en .VURINFO"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "vur: regenerate root .VURINFO"
          git push
