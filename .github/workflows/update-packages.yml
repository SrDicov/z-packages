name: Update packages

on:
  workflow_dispatch:
  schedule:
    # 05:47 UTC: una hora despues del detector, para que no compitan por
    # el rate limit de la API de GitHub.
    - cron: '47 5 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  # Que paquetes se actualizan esta noche. Techo de 5: un upstream roto no
  # debe entrar en 60 paquetes de golpe.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare container
        run: |
          # La imagen base no trae bash y el mirror de CI (repo-ci) no lo
          # publica: se instala antes de cambiar el mirror.
          xbps-install -Sy bash
          mkdir -p /etc/xbps.d
          cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/ 2>/dev/null || true
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y python3 git

      - name: Detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/detect-updates.py --json updates.json

      - name: Plan
        id: plan
        run: |
          python3 .github/scripts/plan-updates.py updates.json 5 > plan.json
          echo "matrix=$(cat plan.json)" >> "$GITHUB_OUTPUT"
          cat plan.json

  # Un paquete por PR. Si el build local falla, no se abre PR: se reporta
  # con una Issue y se sigue con los demas.
  update:
    name: Update ${{ matrix.pkg }}
    needs: plan
    if: "needs.plan.outputs.matrix != '[]'"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      # El bootstrap monta /private y /dev dentro del masterdir: sin
      # privilegios el build se cae. Es lo que hace build.yaml.
      options: --privileged
      volumes:
        - /dev:/dev
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PKG: ${{ matrix.pkg }}
      DIR: ${{ matrix.dir }}
      VER: ${{ matrix.version }}
      DISTFILES: ${{ matrix.distfiles }}
      REPO: ${{ github.repository }}
      # Un PAT (secret PR_TOKEN) es lo que hace que el CI del PR se dispare:
      # los workflows lanzados con GITHUB_TOKEN no activan otros workflows,
      # y el PR se queda sin checks para siempre.
      TOKEN: ${{ secrets.PR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare container
        run: |
          # La imagen base no trae bash y el mirror de CI (repo-ci) no lo
          # publica: se instala antes de cambiar el mirror.
          xbps-install -Sy bash
          mkdir -p /etc/xbps.d
          cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/ 2>/dev/null || true
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y sudo curl git python3
          useradd -G xbuilder -M builder
          chown -R builder:builder .
          sudo -Eu builder common/travis/set_mirror.sh
          sudo -Eu builder common/travis/prepare.sh
          sudo -Eu builder common/travis/add-zrepo.sh x86_64
          common/travis/fetch-xtools.sh

      - name: Apply version
        shell: bash
        run: |
          sudo -Eu builder env REPO_ROOT="$PWD" python3 \
            .github/scripts/apply-update.py "$PKG" "$VER" "$DISTFILES"

      - name: Checksum
        # xgensum es la unica fuente de verdad del sha256: no se inventa.
        # XBPS_DISTDIR lo necesita para encontrar el arbol de paquetes, y el
        # template se pasa como argumento (no el directorio actual).
        # -f: al subir de version el checksum viejo no puede coincidir (es
        # el de otro asset); -f regenera el hash del asset nuevo. Sin -f el
        # paso falla siempre y el updater no llega a abrir ningun PR.
        shell: bash
        run: |
          sudo -Eu builder env XBPS_DISTDIR="$GITHUB_WORKSPACE" \
            /usr/local/bin/xgensum -f -i "srcpkgs/$DIR/template"

      - name: Lint
        shell: bash
        run: sudo -Eu builder common/scripts/lint-templates srcpkgs

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          sudo -Eu builder ./xbps-src -Q pkg "$PKG" 2>&1 | tee /tmp/build.log

      - name: Format the template
        # El CI corre xlint sobre el template tocado: se normaliza antes de
        # commitear (header, orden de variables, tabs).
        shell: bash
        run: |
          python3 .github/scripts/format-template.py "srcpkgs/$DIR/template"

      - name: Push and open PR
        id: pr
        shell: bash
        run: |
          set -e
          echo "token: ${TOKEN:0:4}... (${#TOKEN} chars)"
          branch="update/$PKG-$VER"
          # Se trabaja sobre un clon propio: el workspace no siempre conserva
          # el .git (el build se lleva por delante el arbol de trabajo).
          rm -rf /tmp/pushrepo
          git clone --depth 1 --no-tags \
            "https://x-access-token:$TOKEN@github.com/$REPO.git" /tmp/pushrepo
          cd /tmp/pushrepo
          # xlint rechaza los commits con email noreply: el bot firma con la
          # identidad del maintainer del repo.
          git config user.name "Dicov"
          git config user.email "SrDicov@gmail.com"
          git checkout -b "$branch"
          cp "$GITHUB_WORKSPACE/srcpkgs/$DIR/template" "srcpkgs/$DIR/template"
          # El template copiado debe llevar la version detectada. Sin esta
          # comprobacion, un apply-update que no llego al workspace degrada
          # el paquete en silencio: el PR se llama "update to X" pero deja
          # la version vieja. (Ya ha pasado: opencode-bin 1.19.3 -> 1.18.33.)
          if ! grep -qx "version=$VER" "srcpkgs/$DIR/template"; then
            echo "::error::el template no lleva version=$VER"
            grep -m1 '^version=' "srcpkgs/$DIR/template" || true
            exit 1
          fi
          git add "srcpkgs/$DIR"
          # --allow-empty: si la rama ya estaba actualizada, el commit sin
          # cambios no debe tumbar el job.
          git commit --allow-empty -m "$PKG: update to $VER."
          git push --force origin "HEAD:refs/heads/$branch"
          python3 - <<'PY' > /tmp/pr.json
          import json, os
          print(json.dumps({
              "title": f"{os.environ['PKG']}: update to {os.environ['VER']}",
              "body": "Actualizacion automatica detectada por "
                      "detect-updates.py.\n\n"
                      f"- version: {os.environ['VER']}\n"
                      f"- paquete: {os.environ['PKG']}\n",
              "head": f"update/{os.environ['PKG']}-{os.environ['VER']}",
              "base": "master",
          }))
          PY
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls" \
            -d @/tmp/pr.json > /tmp/pr-resp.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request

          d = json.load(open("/tmp/pr-resp.json"))
          if "number" not in d:
              # Reintento: el PR ya existe, se reutiliza en vez de fallar.
              if "already exists" in json.dumps(d):
                  url = ("https://api.github.com/repos/" + os.environ["REPO"] +
                         "/pulls?state=open&head=" +
                         os.environ["REPO"].split("/")[0] + ":" +
                         "update/" + os.environ["PKG"] + "-" +
                         os.environ["VER"])
                  req = urllib.request.Request(url, headers={
                      "Authorization": "Bearer " + os.environ["TOKEN"],
                      "Accept": "application/vnd.github+json"})
                  with urllib.request.urlopen(req) as r:
                      for pr in json.load(r):
                          print(f"number={pr['number']}")
                          print(f"url={pr['html_url']}")
                          break
              else:
                  raise SystemExit("la API no devolvio un PR: " +
                                   json.dumps(d)[:400])
          else:
              print(f"number={d['number']}")
              print(f"url={d['html_url']}")
          PY

      - name: Report build failure
        # Las issues estan deshabilitadas: el aviso va al resumen del run,
        # que no depende de la API ni de permisos.
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Fallo de build: $PKG $VER"
            echo '```'
            tail -n 200 /tmp/build.log 2>/dev/null || echo "sin log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Espera al CI de cada PR (la matriz de build.yaml) y, si esta en verde,
  # lo mergea. gh solo existe en el runner, no en el contenedor de Void.
  #
  # No se usa needs.update.outputs: un job con matriz devuelve los outputs
  # como un objeto, no como un string. Los PR se localizan por el nombre de
  # la rama, que es donde esta la verdad.
  merge:
    name: Merge when green
    needs: update
    if: always()
    runs-on: ubuntu-latest
    env:
      # PR_TOKEN, no GITHUB_TOKEN: un merge hecho con GITHUB_TOKEN no dispara
      # trigger-repos.yml (GitHub suprime los push de sus propios eventos) y
      # el paquete queda mergeado sin publicar hasta el cron siguiente.
      GH_TOKEN: ${{ secrets.PR_TOKEN }}
    steps:
      - name: Merge
        shell: bash
        run: |
          repo="${{ github.repository }}"
          prs=$(gh pr list --repo "$repo" --state open --limit 50 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("update/")) | .number')
          if [ -z "$prs" ]; then
            echo "no hay PR de actualizacion abiertos"
            exit 0
          fi
          rc=0
          for pr in $prs; do
            echo "== PR #$pr"
            # Los checks del PR aparecen unos segundos despues de abrirlo:
            # se espera a que existan antes de esperarlos.
            seen=0
            # 30 min: con varias builds encoladas los checks tardan en
            # registrarse y una espera corta deja PRs sin mergear.
            for _ in $(seq 1 40); do
              if gh pr checks "$pr" --repo "$repo" >/dev/null 2>&1; then
                seen=1
                break
              fi
              sleep 45
            done
            if [ "$seen" -ne 1 ]; then
              echo "PR #$pr: el CI no ha registrado checks" >&2
              rc=1
              continue
            fi
            # Espera a que terminen los checks, con limite de tiempo: un
            # --watch se queda esperando si algun check se queda en un estado
            # que no avanza (action_required, por ejemplo).
            for _ in $(seq 1 160); do
                pending=$(gh pr checks "$pr" --repo "$repo" --json state \
                    --jq '[.[] | select(.state != "SUCCESS" and .state != "FAILURE" and .state != "SKIPPED")] | length')
                [ "${pending:-0}" -eq 0 ] && break
                sleep 30
            done
            # El merge automatico exige que los BUILDS esten en verde: el
            # lint es cosmetico y sus problemas se reportan aparte.
            if [ "$(gh pr checks "$pr" --repo "$repo" --json name,state \
                --jq '[.[] | select(.name | startswith("Build packages")) | .state] | all(. == "SUCCESS")')" != "true" ]; then
              echo "PR #$pr: los builds no estan en verde, no se mergea" >&2
              rc=1
              continue
            fi
            if gh pr merge "$pr" --repo "$repo" --squash --delete-branch; then
              echo "PR #$pr mergeado"
            else
              echo "PR #$pr: no se pudo mergear" >&2
              rc=1
            fi
          done
          exit $rc

      - name: Report CI failure
        # Issues deshabilitadas: al resumen del run.
        if: failure()
        shell: bash
        run: |
          {
            echo "## Merge automatico abortado"
            echo "Revisa los PR abiertos (update/*): el CI no quedo en verde."
            echo "Si el PR no tiene checks, falta el secret PR_TOKEN (PAT con"
            echo "contents y pull_requests: los workflows lanzados con"
            echo "GITHUB_TOKEN no activan otros workflows)."
          } >> "$GITHUB_STEP_SUMMARY"
