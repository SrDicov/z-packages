name: "Auto-detect & Update Templates"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated list of packages to check/update (empty for auto-plan)"
        required: false
        default: ""
      batch_limit:
        description: "Maximum packages to update in this batch"
        required: false
        default: "5"

permissions:
  contents: write
  pull-requests: write

jobs:
  plan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache quarantine and ETag states
        uses: actions/cache@v4
        with:
          path: |
            .cache
            quarantine.json
          key: autopkg-state-${{ github.run_id }}
          restore-keys: |
            autopkg-state-

      - name: Plan updates via DAG and Quarantine
        id: planner
        run: |
          set -e
          ARGS=("--repo" "." "--limit" "${{ github.event.inputs.batch_limit || '5' }}" "--json")
          if [ -n "${{ github.event.inputs.packages }}" ]; then
            PLAN=$(python3 .github/scripts/autopkg/cli.py plan "${ARGS[@]}" ${{ github.event.inputs.packages }})
          else
            PLAN=$(python3 .github/scripts/autopkg/cli.py plan "${ARGS[@]}")
          fi
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          echo "Planned packages: $PLAN"

      - name: Apply updates and create Pull Requests
        if: steps.planner.outputs.plan != '[]'
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PKGS=$(echo '${{ steps.planner.outputs.plan }}' | jq -r '.[]')
          BASE_BRANCH="${{ github.ref_name }}"
          for pkg in $PKGS; do
            echo "Processing update for $pkg..."
            BRANCH="autopkg/$pkg"
            git checkout -b "$BRANCH" "$BASE_BRANCH" || git checkout "$BRANCH"

            # Run non-destructive template updater
            python3 .github/scripts/autopkg/cli.py update --repo "." "$pkg"

            if ! git diff --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -am "$pkg: update to latest upstream release"
              git push -f origin "$BRANCH"

              # Open PR with autopkg-update label (triggers event-driven build without sleep loops)
              gh label create autopkg-update --color "0e8a16" --description "Automated update generated by autopkg-engine" --force || true
              gh pr create \
                --title "$pkg: update to latest upstream release" \
                --body "Automated update generated by autopkg-engine. Preserves formatting and verified non-destructive." \
                --label "autopkg-update" \
                --base "$BASE_BRANCH" \
                --head "$BRANCH" || echo "PR already exists"
            fi
            git checkout "$BASE_BRANCH"
          done
